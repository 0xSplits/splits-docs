name: Lint prose

# No paths filter: a required check that never runs leaves a PR pending forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # check-prose.mjs has no dependencies, so there is no install step.
      - run: node scripts/check-prose.mjs --selftest
      - run: node scripts/check-prose.mjs --strict src/pages/solutions
